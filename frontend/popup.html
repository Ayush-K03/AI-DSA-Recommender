<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="popup-container">
      <div class="header-wrapper">
        <div>
          <h2>🏔️ LeetApex</h2>
          <div class="subtitle">Your DSA Companion</div>
        </div>
        <button id="close-popup-icon" title="Close">&#10005;</button>
      </div>

      <!-- Tab Buttons -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="review">📋 Review</button>
        <button class="tab-btn" data-tab="upcoming">⏰ Next</button>
        <button class="tab-btn" data-tab="past">⏳ Missed</button>
        <button class="tab-btn" data-tab="streak">🔥 Streak</button>
        <button class="tab-btn" data-tab="analytics">📊 Stats</button>
      </div>

      <!-- Review Today Tab -->
      <div id="tab-review" class="tab-content active">
        <div id="review-list">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <!-- Upcoming Tab -->
      <div id="tab-upcoming" class="tab-content">
        <div id="upcoming-list">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <!-- Past missed reminders tab  -->
      <div id="tab-past" class="tab-content">
        <div id="past-list">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <!-- Streak Tab -->
      <div id="tab-streak" class="tab-content">
        <div id="streak-container">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <!-- Analytics Tab -->
      <div id="tab-analytics" class="tab-content">
        <div id="analytics-container">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
